  - kind: improper format
    stored:
    - 50
    - 3
    - 122064
    action: reordered to (frame, channel, sample), float64, fs = baseFrequency/decimation;
      window samples stored in X_windows.npy
  - kind: incorrect
    clipping_frames: []
    action: clipping flagged only; 4th-order Butterworth (600.0, 2000.0) Hz (filtfilt);
      cut 3051 samples per edge. Odd 50 Hz harmonics inside the band remain.
  - kind: incomplete
    nan_frames: []
    dead_frames: []
    action: drop frames with NaN/Inf or with RMS < 10 % of median on all channels;
      units of /data marked UNKNOWN in metadata
  - kind: irrelevant or duplicated
    duplicate_frames: []
    channel: 0
    action: drop exact duplicate frames; keep only the strongest channel
  - kind: incorrect (labels)
    rows_dropped: 0
